[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-ops"
version = "1.0.0"
description = "n8n AI automation suite defined as code, with an MCP tool server"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
http = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
flowops = "flowops.cli:main"
flowops-mcp = "flowops.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
